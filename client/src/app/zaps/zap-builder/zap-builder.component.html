<div class="builder" [attr.aria-busy]="saving">
  <header class="header" [attr.inert]="saving ? '' : null">
    <a mat-icon-button routerLink="/zaps" aria-label="Back to your Zaps">
      <mat-icon>arrow_back</mat-icon>
    </a>

    <ng-container *ngIf="form">
      <mat-form-field class="name" subscriptSizing="dynamic">
        <input matInput [formControl]="form.controls.name" aria-label="Zap name" />
        <mat-icon matSuffix>edit</mat-icon>
        <mat-error>{{ form.controls.name.getError('zod') }}</mat-error>
      </mat-form-field>

      <span class="spacer"></span>

      <span class="toggle" [matTooltip]="toggleTooltip" [matTooltipDisabled]="!toggleBlocked">
        <mat-slide-toggle
          [checked]="zap?.enabled ?? false"
          [disabled]="toggleBlocked || toggling || saving"
          [attr.aria-label]="zap?.enabled ? 'Turn off this Zap' : 'Turn on this Zap'"
          (change)="onToggle($event)"
        >
          {{ zap?.enabled ? 'On' : 'Off' }}
        </mat-slide-toggle>
      </span>

      <button mat-flat-button color="primary" type="button" class="save" [disabled]="!canSave" (click)="save()">
        <mat-spinner *ngIf="saving" diameter="18"></mat-spinner>
        <span>Save</span>
      </button>

      <ng-container *ngIf="zap">
        <button
          mat-icon-button
          type="button"
          class="menu-button"
          [matMenuTriggerFor]="zapMenu"
          [disabled]="saving"
          aria-label="Zap actions"
        >
          <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #zapMenu="matMenu">
          <button mat-menu-item type="button" class="delete-item" (click)="onDelete()">Delete</button>
        </mat-menu>
      </ng-container>
    </ng-container>
  </header>

  <div *ngIf="loading" class="loading">
    <mat-spinner diameter="48"></mat-spinner>
  </div>

  <div *ngIf="notFound" class="not-found">
    <h2>Zap not found</h2>
    <a mat-stroked-button routerLink="/zaps">Back to your Zaps</a>
  </div>

  <div *ngIf="form && zap?.enabled" class="enabled-banner" role="status">
    <mat-icon aria-hidden="true">info</mat-icon>
    <span>{{ enabledBanner }}</span>
  </div>

  <mat-accordion *ngIf="form && app" class="steps" [attr.inert]="saving ? '' : null">
    <app-trigger-step
      [app]="app"
      [group]="form.controls.trigger"
      [repos]="repos"
      [reposLoaded]="reposLoaded"
      [expanded]="true"
    ></app-trigger-step>
    <div class="connector" aria-hidden="true"></div>
    <app-action-step [app]="app" [group]="form.controls.action"></app-action-step>
  </mat-accordion>

  <!-- Saving: the builder stays rendered underneath, out of reach (Screens.md → States, U1). -->
  <div *ngIf="saving" class="saving-overlay" role="status" aria-label="Saving">
    <mat-spinner diameter="48"></mat-spinner>
  </div>
</div>
