<div class="page">
  <mat-card class="card">
    <mat-card-content>
      <h1 class="brand">⚡ Zaps</h1>
      <p class="tagline">Automate your GitHub workflow: when a PR opens, comment on it.</p>
      <button mat-raised-button color="primary" type="button" class="sign-in" (click)="signIn()">
        Sign in with GitHub
      </button>
      <p *ngIf="errorMessage" class="login-error" role="alert">⚠ {{ errorMessage }}</p>
    </mat-card-content>
  </mat-card>
</div>
